# Конфиг движка TraderBot v0.1. Все пороги и частоты — здесь, не в коде.
# После правки порогов увеличить config_version: каждая запись журнала хранит версию и хеш конфига.

[meta]
config_version = 3

[paths]
db = "data/traderbot.sqlite"
log = "logs/engine.log"

[lake]
archive_dir = "E:/Bulk/history"
lake_dir    = "E:/Bulk/lake"

[binance]
rest_base = "https://fapi.binance.com"
# С 2026 года потоки USDⓈ-M разведены по /public, /market, /private.
# Свечи, тикеры, mark price, ликвидации и aggTrade — в /market.
ws_market_base = "wss://fstream.binance.com/market"
streams_per_connection = 200      # лимит Binance — 1024, держим запас и короткий URL
ws_idle_timeout_sec = 90          # нет сообщений дольше — переподключение
rest_weight_budget_per_min = 1200 # лимит IP — 2400, движок берёт половину
rest_weight_reserve_high = 600    # сверх бюджета — только для срочного живого OI
futures_data_per_5min = 900       # /futures/data/*: лимит по памяти ~1000 запросов за 5 мин
quote_asset = "USDT"

[collect]
history_days_on_start = 8         # сколько истории 5m догрузить при первом старте
backfill_concurrency = 6
reconcile_delay_sec = 20          # через сколько после закрытия бара проверять, что он пришёл у всех
hole_scan_every_min = 60          # проверка дыр в свечах
hole_scan_hours = 48
universe_refresh_hours = 24       # exchangeInfo
retention_days = 60               # сырые данные храним скользящим окном
status_every_sec = 60
db_flush_sec = 1.0

[metrics]
sets_refresh_sec = 10             # как часто перечитывать «в фокусе» и «под наблюдением»
watch_hours = 4.5                 # монета под наблюдением от искры до T+4.5 ч
oi_bar_delay_sec = 1              # OI по всем — через столько после закрытия бара
oi_late_sec = 15                  # замер позже этого считается опоздавшим (в статусе)
oi_concurrency = 20
oi_watch_sec = 60
oi_focus_sec = 12
oi_hist_start_limit = 500         # при старте: 500 точек ≈ 41 ч
oi_hist_limit = 15                # раз в час: последние 15 точек
oi_hist_every_min = 60
ls_delay_sec = 40                 # L/S — через столько после закрытия бара
ls_history_days = 7               # для процентиля к неделе
ls_top_history_hours = 2          # L/S топ-трейдеров при попадании монеты под наблюдение
fd_concurrency = 8
depth_limit = 500
depth_every_min = 60

[sparks]
delay_sec = 25                    # поиск искр через столько после закрытия бара (после сверки свечей)
catchup_hours = 48                # при первом старте — искры по истории за столько часов
rescan_hours = 6                  # при перезапуске пересмотреть последние часы: недописанные искры досчитаются
warmup_hours = 120                # разгон «первой за 12 ч» перед историей (не пишется); цепочка
                                  # отборов тянется назад, поэтому разгон — на всю доступную историю

[context]
ctx_wait_min = 30                 # сколько ждать точку L/S на момент T, потом считать без неё
conf_wait_min = 10                # сколько ждать OI на T+30
week_min_bars = 1000              # «неделя» (max/min за 7 дней) — нужно хотя бы столько баров
fade_vx = 2.0                     # затухание: объём подхвата меньше 2× обычного

[live]
fast_sec = 12                     # живые теги для монет «в фокусе» — раз в столько секунд
focus_spark_hours = 24            # в фокусе берём последнюю искру монеты не старше стольких часов
exit_after_gain = 10              # маркеры выхода включаются после +10% от открытия искры
exit_oi_drop = -10                # OI упал на 10% от максимума — «топливо кончилось»
exit_ls_rise = 10                 # L/S вырос на 10% от минимума — «возможна раздача»
# Пороги пяти флагов и стадий зашиты в ref.stage_flags (как в исследовании): +10%, L/S +5%, OI −4%,
# объём > 50% пика, +2% за 15 мин; стадии: L/S +2% / +5%, OI −1% / −4%.

[watchlist]
creep_in = 5.0                    # «ползут»: вход при росте за 6 ч (close к close) ≥ 5%
creep_out = 1.0                   # выход при росте за 6 ч < 1%
creep_cooldown_bars = 24          # повторный вход не раньше чем через 2 ч после выхода
creep_oi6_min = 3.0               # в список: OI за 6 ч > +3% (и L/S < ls_low)
creep_replay_hours = 36           # при старте эпизоды восстанавливаются прогоном по истории
ls_min_history = 1900             # L/S-процентиль точный, если за неделю есть столько точек из 2016
ls_fix_minutes = 60               # сколько ждать точную точку L/S на баре входа
capit_bars = 200                  # окно 4h-свечей (≈33 дня): разгон WVF 70 баров + 14 дней исхода
capit_spent_pct = 30              # «израсходован»: цена выше минимума зоны больше чем на 30%
capit_delay_sec = 90              # пересчёт через столько после закрытия 4h-бара

[paper]
stream = "mean"                    # чьи флаги правил брать: med — поток медианы (v0.1), mean — среднего 20 (исследование)
deposit = 100.0                   # $ на каждый счёт, виртуально
leverage = 5.0                    # изолированная маржа
risk_pct = 1.0                    # риск на сделку, % текущего баланса
max_positions = 5
max_total_risk_pct = 5.0          # суммарный риск открытых позиций
max_stop_pct = 15.0               # стоп дальше — пропуск (ликвидация при 5× около −19%)
stop_pad = 0.002                  # стоп = минимум искры − 0.2% от цены T+30
trail = 0.08                      # трейлинг 8% от максимума
hold_hours = 48                   # таймаут от T+30
fee_pct = 0.05                    # тейкер, в каждую сторону
max_signal_age_min = 15           # сигнал старше (после T+30) — пропуск «опоздание» (например, после перезапуска)
pause_enabled = false             # пауза после серии убытков: по умолчанию выключена
pause_losses = 4
state_every_sec = 5               # как часто писать состояние позиций и проверять таймаут
trade_idle_sec = 900              # aggTrade: тишина дольше — переподключение (неликвидные монеты торгуются редко)

[outcomes]
every_min = 15                    # как часто досчитывать исходы
max_age_days = 60                 # искры старше — не трогаем
fork_up_pct = 10                  # «вилка» для исходов по стадиям: +10% …
fork_down_pct = 5                 # … или −5% от цены в момент тега, что раньше
fork_hours = 48

# Пороги исследования. Ключи = TH из engine/ref.py, значения по умолчанию = проверенные.
[thresholds]
spark15_ret_min = 2.0
spark15_ret_max = 8.0
spark15_relvol = 4.0
spark15_gap_bars = 48             # 12 ч в 15m-свечах
liq_min_musd = 0.5
liq_max_musd = 30.0               # проверенный диапазон оборота
spark5_ret_min = 2.0
spark5_ret_max = 8.0
spark5_vx = 5.0
spark5_gap_bars = 144             # 12 ч в 5m-барах
conf_vx = 5.0                     # подхват: объём ≥ 5× среднего 5m за −24…−6 ч
conf_tbr = 0.45                   # подхват: доля тейкер-покупок ≥ 45%
conf_dd = -1.5                    # подхват: просадка от закрытия искры не глубже −1.5%
conf_r = 1.0                      # подхват: закрытие T+30 выше закрытия искры больше чем на 1%
ls_low = 20.0                     # L/S в нижних 20% недели
thin_ask2 = 50000.0               # тонкий стакан: офферы до +2% меньше $50k
creep_log = 3.0                   # рост за 6 ч > 3 (лог-процент)
oi30_up = 2.0                     # OI за 30 мин вырос на 2% и больше
morning = [6, 12]                 # утреннее окно, часы МСК [6, 12)
pump_mult = 1.25                  # памп: +25% от открытия искры
pump_bars = 144                   # … за 12 ч
trail = 0.08                      # модель сделки: трейлинг 8% от максимума
stop_pad = 0.002                  # стоп = минимум искры − 0.2% от цены входа
hold_bars = 576                   # таймаут 48 ч
cost_pct = 0.2                    # издержки на сделку, %

[web]
host = "127.0.0.1"
port = 5000

# Цвета тегов в ленте и фильтры по умолчанию. На расчёты движка не влияют.
[ui]
sse_poll_sec = 2
sse_prices_sec = 3
sse_status_sec = 10
feed_hours = 24
filter_turnover_min = 0.5         # $M, лента по умолчанию — проверенный диапазон
filter_turnover_max = 30.0
ls_green = 20                     # L/S к неделе: < 20 зелёный
ls_red = 80                       # ≥ 80 красный
pre6_green = 3                    # рост 6 ч (лог-%): > 3 зелёный
pre6_strong = 8                   # > 8 — сильный
ask2_green = 50000                # стакан до +2%: < $50k зелёный
ask2_red = 150000                 # > $150k красный
oi30_green = 2                    # OI за 30 мин: ≥ +2% зелёный, < 0 красный
oi30_warn = 5                     # > +5% жёлтый: «возможен вынос лонгов»
short_red = 50                    # доля роста на закрытии шортов > 50% — красный
week_info = 40                    # размах недели > 40% — «серийный»
funding_info = -0.01              # funding на 8 ч < −0.01% — «шорты платят»
morning_from = 6                  # утреннее окно, часы МСК
morning_to = 12
heartbeat_alert_sec = 180         # нет сигнала от движка дольше — красный статус
